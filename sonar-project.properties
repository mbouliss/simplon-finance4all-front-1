# Configuration SonarQube pour simplon-finance4all-front-1
sonar.projectKey=simplon-finance4all-front-1
sonar.projectName=simplon-finance4all-front-1
sonar.projectVersion=1.0

# Source code
sonar.sources=src
sonar.exclusions=node_modules/**,build/**,dist/**,coverage/**

# Tests
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx
sonar.test.exclusions=node_modules/**

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx

# Language
sonar.sourceEncoding=UTF-8